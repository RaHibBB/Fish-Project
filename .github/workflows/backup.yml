# Weekly backup of the Neon database into a separate PRIVATE repo (e.g. you/farm-backups).
#
# Secrets in THIS repo (Settings → Secrets and variables → Actions):
#   DATABASE_URL        Neon connection string (use the direct, non-pooled host)
#   BACKUP_REPO         owner/name of the private backup repo, e.g. RaHibBB/farm-backups
#   BACKUP_DEPLOY_KEY   private SSH key whose public half is a *write* deploy key on that repo
#                       (can only push to the backup repo — nothing else)
name: Weekly backup

on:
  schedule:
    - cron: "0 20 * * 5" # Friday 20:00 UTC = Saturday 02:00 Dhaka
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PG_MAJOR: "18" # must be >= the Neon Postgres version (Neon runs 18)
    # Throwaway database used to prove each backup can actually be restored.
    services:
      restore-test:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: restore-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"

      - name: Check out backup repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKUP_REPO }}
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          path: backups

      - name: Check the database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL secret (Neon connection string) to this repo."
            exit 1
          fi

      - name: Dump database and tables
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          PG="/usr/lib/postgresql/${PG_MAJOR}/bin"
          DAY=$(TZ=Asia/Dhaka date +%F)
          OUT="backups/${DAY}"
          mkdir -p "$OUT"
          "$PG/pg_dump" --format=custom --no-owner --no-privileges --file "$OUT/farm.dump" "$DATABASE_URL"
          for t in partners settings categories ponds expenses contributions withdrawals sales feedings audit_log; do
            if [ "$t" = partners ]; then
              q="select id, name, phone, share_bp, sort_order, created_at from partners order by id"
            else
              q="select * from $t order by id"
            fi
            "$PG/psql" "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\copy ($q) to '$OUT/$t.csv' with (format csv, header, encoding 'UTF8')"
          done
          cp docs/backup-README.md backups/README.md
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Restore test (prove the backup works)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_URL: postgresql://postgres:restore-test@localhost:5432/postgres
        run: |
          set -uo pipefail
          PG="/usr/lib/postgresql/${PG_MAJOR}/bin"
          # Non-fatal warnings (e.g. Neon-specific roles) are fine; the row counts below are the real check.
          "$PG/pg_restore" --no-owner --no-privileges -d "$TEST_URL" "$OUT/farm.dump" 2> restore-warnings.txt || true
          REPORT="$OUT/RESTORE-CHECK.txt"
          echo "Restore check $(TZ=Asia/Dhaka date '+%F %H:%M') — rows in live DB vs restored copy" > "$REPORT"
          ok=1
          for t in partners settings categories ponds expenses contributions withdrawals sales feedings audit_log; do
            live=$("$PG/psql" "$DATABASE_URL" -tAc "select count(*) from $t")
            restored=$("$PG/psql" "$TEST_URL" -tAc "select count(*) from $t" 2>/dev/null || echo "missing")
            mark="OK"; [ "$live" = "$restored" ] || { mark="MISMATCH"; ok=0; }
            printf '%-15s live=%-6s restored=%-6s %s
' "$t" "$live" "$restored" "$mark" >> "$REPORT"
          done
          cat "$REPORT"
          [ "$ok" = 1 ] && echo "RESULT: backup restores correctly" >> "$REPORT"
          [ "$ok" = 1 ] || { echo "::error::Backup could not be restored completely — see RESTORE-CHECK.txt"; cat restore-warnings.txt; exit 1; }

      - name: Commit
        # Save the backup even if the restore check failed (that run is still marked failed).
        if: ${{ !cancelled() && steps.dump.outcome == 'success' }}
        working-directory: backups
        run: |
          git config user.name "farm-backup-bot"
          git config user.email "farm-backup-bot@users.noreply.github.com"
          git add -A
          git commit -m "Backup $(TZ=Asia/Dhaka date +%F)" || echo "Nothing changed"
          git push
